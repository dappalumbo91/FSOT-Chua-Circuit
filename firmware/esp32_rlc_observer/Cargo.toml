[package]
name = "fsot_esp32_rlc_observer"
version = "0.1.0"
edition = "2021"
description = "FSOT 3-node RLC array observer — 12-bit ADC + trinary collapse, no_std"

[[bin]]
name = "fsot-esp32-rlc"
path = "src/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
esp-alloc = "0.10.0"
libm = "0.2"
nb = "1"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
