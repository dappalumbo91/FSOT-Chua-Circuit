name: FSOT-Circuit CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-and-smt:
    name: Pin + algebra + ODE + SMT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Algebra + pin
        run: python tests/test_algebra.py
      - name: SMT python bounds
        run: python verification/smt_replay.py
      - name: Host observer twin
        run: python firmware/host_observer.py
      - name: Chua ring gates
        run: python -m sim.run_sim
      - name: Obligation checker
        run: python verification/verify_circuit.py
      - name: Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          z3 verification/circuit_bounds.smt2 | tee /tmp/z3.out
          grep -q '^sat' /tmp/z3.out

  lean:
    name: Lean 4 application priors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: lake build
        run: lake build

  rust:
    name: Rust host kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo run
        working-directory: verification/rust_circuit_kernel
        run: cargo run --release | tee /tmp/rust.out
      - name: require marker
        run: grep -q FSOT_CIRCUIT_RUST_OK /tmp/rust.out

  coq:
    name: Coq/Rocq spine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Do not use job-level `container: coqorg/coq` — that image is non-root
      # and checkout@v4 cannot write runner save_state (EACCES).
      - name: Install Coq
        run: sudo apt-get update && sudo apt-get install -y coq
      - name: coqc
        working-directory: formal/coq
        run: coqc CircuitArray.v

  tla:
    name: TLA+ TLC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC
        working-directory: formal/tla
        run: |
          java -cp ../../tools/tla/tla2tools.jar tlc2.TLC -config CircuitArray.cfg CircuitArray.tla | tee /tmp/tlc.out
          grep -q "No error has been found" /tmp/tlc.out

  cpp:
    name: C++20 Branch L golden + ring tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev
      - name: Configure (fetches FSOT-2.1-Cpp at the pinned AEB2AD commit)
        run: cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build cpp/build
      - name: ctest
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Build error-budget tools (eb, mc) and smoke-run the standard-model MSF
        run: |
          cmake -S error_budget -B error_budget/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build error_budget/build
          ./error_budget/build/mc point r=18.4400497592861384 T=3000

  minimal-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y ngspice python3-numpy
      - name: Build C++20 engines (mj ideal PWL jerk, oa full TL07x model)
        working-directory: minimal
        run: |
          g++ -std=c++20 -O3 -pthread -o mj src/mj.cpp
          g++ -std=c++20 -O3 -pthread -o oa src/oa.cpp
          g++ -std=c++20 -O2 -o bd src/bd.cpp
          g++ -std=c++20 -O2 -fopenmp -o proof/proof proof/proof.cpp
          g++ -std=c++20 -O2 -o topo/tj topo/tj.cpp
          g++ -std=c++20 -O2 -o topo/bpr topo/bpr.cpp
      - name: "Interval proof replay (covering relation Na => Na at A = 1/phi)"
        working-directory: minimal/proof
        run: NSUB=256 ./proof check hsets.txt
      - name: "Replay locks and key facts (hashes, lambda1 > 0, sum = -A, J1 unbounded)"
        working-directory: minimal
        run: |
          python3 tools/check_minimal.py
          ./oa nic=2 T=500
      - name: "ngspice smoke (ideal E-source op-amps, real 1N4148), R_A 2912.5 periodic and R_A 3150 chaotic"
        working-directory: minimal/spice
        run: |
          mkdir -p netlists out
          python3 mkcir.py 2912.5 ci_nom -0.5 ideal && python3 mkcir.py 3150 ci_3150 -0.5 ideal
          ngspice -b netlists/ci_nom.cir > /dev/null && ngspice -b netlists/ci_3150.cir > /dev/null
          python3 -c "import analyze as a; n=a.stats('ci_nom'); c=a.stats('ci_3150'); print(n, c); assert n['n_distinct_maxima'] <= 4 and c['n_distinct_maxima'] > 40"

  horseshoe-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Build interval horseshoe prover (C++20, OpenMP)"
        working-directory: minimal/proof
        run: g++ -std=c++20 -O2 -fopenmp -o horseshoe horseshoe.cpp
      - name: "Replay covering relations at A = gamma_rel (P^4, h-sets in golden.txt)"
        working-directory: minimal/proof
        run: ./horseshoe check golden.txt

